; https://docs.platformio.org/page/projectconf.html

[env:ATmega3209]
platform = atmelmegaavr
board = ATmega3209
framework = arduino

upload_protocol = serialupdi

board_build.f_cpu = 20000000L

lib_deps = 
	file:///home/aidan/Arduino/libraries/elapsedMillis
	file:///home/aidan/Arduino/libraries/Vector/src
	file:///home/aidan/Arduino/libraries/MCP23S08-master
	file:///home/aidan/Arduino/libraries/MCP4251/src